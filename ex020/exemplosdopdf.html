<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo do PDF</title>
    <style>
        body {
            font: normal 1em Arial, Helvetica, sans-serif;
        }
        a {
            font-weight: bold;
            text-decoration: none;
            color: red;
        }
        a:visited {
            color: darkred;
        }
        a:hover {
            text-decoration: underline;
        }

        .especial:hover {
            color: white;
            background-color: black;
            text-decoration: none;
        }

        .especial::before {
            content: '>>';
            font-weight: lighter;
        }

        .especial::after {
            content: '<<';
            font-weight: lighter;
        }
    </style>
</head>
<body>
    <h1>Personalizando um link</h1>
    <p>Para aprender HTML5 e CSS3 acesse o 
        <a href="https://github.com/gustavoguanabara/html-css/tree/master/aulas-pdf">Github do Guanabara
        </a>
    </p>
    <p>
        Se quiser conecer mais sobre os padrões, visite o site do <a href="https://www.w3c.br/">Escritório do w3c no Brasil</a>
    </p>
    <p>
        Para acompanhar os cursos acesse o 
        <a href="https://www.youtube.com/cursoemvideo" class="especial">canal do Curso em Vídeo</a>
    </p>
</body>
</html>
