<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 { /*box-level*/
            background-color: lightgray;
            height: 300px;
            width: 300px;
            /*
            MODELO EXTENSO
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray;
            */
            /*MODELO SIMPLIFICADO*/
            border: 10px solid darkslategray;

            /*
            MODELO EXTENSO
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            */
            /*MODELO SIMPLIFICADO*/
            padding: 10px;

            /*
            MODELO EXTENSO
            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 40px;
            margin-left: 10px;
            */

            /*MODELO SIMPLIFICADO*/
            margin: 10px 10px 40px 10px;

            /*
            MODELO EXTENSO
            outline-width: 5px;
            outline-style: dashed;
            outline-color: salmon;
            */

            /*MODELO SIMPLIFICADO*/
            outline: 5px dashed salmon;
        }
        a {/*inline-level*/
            border-width: 10px;
            border-style: solid;
            border-color: red;
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
