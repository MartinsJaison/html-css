<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de semântica</title>
    <!--Exemplo de uso de CSS para alterações na página-->
    <style>
        body{
            background-color: rgb(165, 165, 214);
        }
    </style>
</head>
<body>
    <!--Diferente da tag u que apenas sublinhava o endereço, essa nova tag abaixo me dá o significado do que está em itálico: o endereço (address)-->
    <p>
    Eu moro na <address>Rua dos Capixabas, 229 - Botafogo - RJ</address>
    </p>
</body>
</html>
