<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML5</title>
</head>
<body>
    <h1>Tags em HTML5</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir.<br> Passe o Mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
    <ul>
        <li class="item1" type="square"><abbr title="Use a tag &lt;p&gt;">Parágrafos</abbr>
        </li>
        <li class="item2" type="square">
            <abbr title="Use a tag &lt;h1&gt;">Títulos</abbr>
        </li>
        <li class="item3" type="square">
            <abbr title="Use a tag &lt;img&gt;">Imagens</abbr>
        </li>
        <li class="item4" type="square">
            <abbr title="Use a tag &lt;abbr&gt;">Abreviações</abbr>
        </li>
        <li class="item5" type="square">
            <abbr title="Use a tag &lt;code&gt;">Códigos-Fonte</abbr>
        </li>
        <li class="item6" type="square">
            <abbr title="Use a tag &lt;ol&gt;">Listas numeradas</abbr>
        </li>
        <li class="item7" type="square">
            <abbr title="Use a tag &lt;ul&gt;">Listas com demarcadores</abbr>
        </li>
        <li class="item8" type="square">
            <abbr title="Use a tag &lt;audio&gt;">Áudios</abbr>
        </li>        
    </ul>
</body>
</html>
