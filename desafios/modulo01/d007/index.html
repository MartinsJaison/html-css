<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem Flexível</title>
</head>
<body>
    <h1>Imagem Flexível</h1>
    <p>Você está vendo a imagem completa?<br> Experimente ampliar o tamanho da sua janela para aproveitar a melhor experiência</p>
    <picture>
        <!--no srcset carregamos a imagem menor-->
        <source media="(max-width: 750px)" srcset="imagens/pequena-pexels-lorenzomessinaph-28210181.png" type="image/png">
        <source media="(max-width: 1050px)" 
        srcset="imagens/media-pexels-lorenzomessinaph-28210181.png" type="image/png">
        <img src="imagens/grande-pexels-lorenzomessinaph-28210181.png" alt="Imagem Flexível ANTILOPES">
    </picture>
</body>
</html>
